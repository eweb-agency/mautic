; Drop reasons for the segmentation assistant.
;
; Translated SERVER-SIDE (AiSegmentController): the browser receives ready-to-
; display sentences, never a technical code. They tell the customer what was
; NOT kept from their request — an assistant that silently discards half of a
; request lets the customer believe it understood everything.
;
; Register: explain what the customer can do, no jargon, no blame.

