; Motifs de rejet de l'assistant de segmentation.
;
; Ces phrases sont traduites CÔTÉ SERVEUR (AiSegmentController) : le navigateur
; reçoit du texte prêt à afficher, jamais un code technique. Elles disent au
; client ce qui n'a PAS été retenu dans sa demande — un assistant qui écarte la
; moitié d'une demande en silence laisse croire qu'il a tout compris.
;
; Registre : on explique ce que le client peut faire, sans jargon et sans
; l'accuser. « n'existe pas sur votre compte » plutôt que « champ invalide ».

