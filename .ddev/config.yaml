type: php
docroot: ""
php_version: "8.4"
webserver_type: apache-fpm
timezone: UTC
database:
    type: mariadb
    version: "10.11"
hooks:
    post-start:
        - exec: sed -i -e 's/\r$//' ./.ddev/mautic-setup.sh
        - exec: sed -i -e 's/\r$//' ./.git/hooks/*
        - exec: chmod +x ./.ddev/mautic-setup.sh
        - exec: yes | ./.ddev/mautic-setup.sh
upload_dirs:
    - media/files
    - media/images
webimage_extra_packages: ["php${DDEV_PHP_VERSION}-imap"]
use_dns_when_possible: true
composer_version: "2"
nodejs_version: "24"
web_environment:
    - "MAUTIC_CONTACT_MAX_LIMIT=2"
    - "MAUTIC_SAML_IDP_ENTITY_ID=https://mautic.ddev.site"
    - "MAUTIC_SAML_REQUIRED_GROUP_ID=57f5ac2a-b3ca-4af6-864e-52ac500ede08"
    - "MAUTIC_LOGOUT_REDIRECT_URL=http://localhost:3000/fr/auth/logout"
    - "MAUTIC_AUTH_FAILURE_REDIRECT_URL=http://localhost:3000/fr/dashboard"
    - "MAUTIC_SAML_IDP_EMAIL_ATTRIBUTE=email"
    - "MAUTIC_SAML_IDP_USERNAME_ATTRIBUTE=username"
    - "MAUTIC_SAML_IDP_FIRSTNAME_ATTRIBUTE=firstName"
    - "MAUTIC_SAML_IDP_LASTNAME_ATTRIBUTE=lastName"
    - "MAUTIC_SAML_IDP_DEFAULT_ROLE=7"
    - "MAUTIC_SAML_GROUP_ATTRIBUTE=Group"
    - "MAUTIC_SAML_ROLE_ATTRIBUTE=Role"
    - "MAUTIC_SAML_IDP_"
corepack_enable: false